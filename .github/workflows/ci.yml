name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*'] # release.yml builds tags
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  WAILS_VERSION: v2.16.0

jobs:
  go:
    name: Go (vet, unit, integration)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # main.go embeds frontend/dist; vet/test of the root package only needs it to exist.
      - name: Placeholder frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.keep

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi

      # The root package uses Wails/webkit cgo bindings on Linux.
      - name: Install Linux webkit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      - name: Unit tests
        run: go test -tags webkit2_41 -race -count=1 ./...

      - name: Start mock Argo CD
        run: |
          go build -o "$RUNNER_TEMP/mockargo" ./cmd/mockargo
          "$RUNNER_TEMP/mockargo" -port 8099 -apps 3000 > "$RUNNER_TEMP/mockargo.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8099/api/version >/dev/null; then echo "mockargo up"; exit 0; fi
            sleep 1
          done
          echo "::error::mockargo did not start"; cat "$RUNNER_TEMP/mockargo.log"; exit 1

      - name: Integration tests
        env:
          MOCKARGO_URL: http://localhost:8099
        run: go test ./internal/store -run Integration -race -count=1 -v

      - name: mockargo log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/mockargo.log" || true

  frontend:
    name: Frontend (types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: [go, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tags: ''
          - os: windows-latest
            tags: ''
          - os: ubuntu-24.04
            tags: webkit2_41
          - os: ubuntu-24.04-arm
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: wails doctor
        run: wails doctor || true

      - name: wails build
        run: |
          args=(-clean -trimpath -ldflags "-X main.version=ci-${GITHUB_SHA::7}")
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          wails build "${args[@]}"
          ls -la build/bin

      - uses: actions/upload-artifact@v4
        with:
          name: syncscope-${{ runner.os }}-${{ github.sha }}
          path: build/bin/
          retention-days: 7
