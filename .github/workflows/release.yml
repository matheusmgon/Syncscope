name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.2.0'
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  WAILS_VERSION: v2.16.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            slug: darwin_universal
          - os: windows-latest
            platform: windows/amd64
            slug: windows_amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            slug: linux_amd64
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # secrets cannot be used in `if:` directly; expose whether signing is configured
      MAC_SIGN: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' }}
      MAC_NOTARIZE: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Info.plist / NSIS need a plain x.y.z
          NUMERIC="${VERSION%%[-+]*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"
          echo "base=Syncscope_${TAG}_${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: NSIS
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Stamp version into wails.json
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            j.info.productVersion = process.argv[1];
            fs.writeFileSync("wails.json", JSON.stringify(j, null, 2) + "\n");
          ' "${{ steps.v.outputs.numeric }}"

      - name: wails build
        run: |
          args=(-clean -trimpath -platform "${{ matrix.platform }}" -ldflags "-s -w -X main.version=${{ steps.v.outputs.tag }}")
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          if [ "${{ runner.os }}" = "Windows" ]; then args+=(-nsis); fi
          wails build "${args[@]}"
          ls -la build/bin

      # ---------------- macOS: optional signing + notarization ----------------
      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then echo "::error::no 'Developer ID Application' identity in the certificate"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Code sign (hardened runtime)
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        run: |
          APP=build/bin/Syncscope.app
          codesign --force --deep --timestamp --options runtime \
            --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple
        if: runner.os == 'macOS' && env.MAC_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=build/bin/Syncscope.app
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Clean up keychain
        if: always() && runner.os == 'macOS' && env.MAC_SIGN == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # ---------------- package ----------------
      - name: Package
        run: |
          BASE="${{ steps.v.outputs.base }}"
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --sequesterRsrc --keepParent build/bin/Syncscope.app "dist/$BASE.zip"
              ;;
            Windows)
              installer=$(ls build/bin/*installer*.exe 2>/dev/null | head -n1 || true)
              if [ -n "$installer" ]; then cp "$installer" "dist/${BASE}_installer.exe"; fi
              7z a -tzip "dist/$BASE.zip" ./build/bin/Syncscope.exe
              ;;
            Linux)
              tar -C build/bin -czf "dist/$BASE.tar.gz" Syncscope
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Syncscope ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
